<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ATLAS | Monitoreo inteligente</title>

  <meta
    name="description"
    content="ATLAS es una plataforma modular de monitoreo inteligente para prevenir pérdidas, optimizar recursos y anticipar condiciones críticas."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #172033;
      line-height: 1.6;
    }

    /* ---------- COLORES ---------- */

    :root {
      --navy: #071a35;
      --blue: #0d3566;
      --teal: #0a8c87;
      --teal-light: #20b6aa;
      --white: #ffffff;
      --light: #eef4f7;
      --gray: #667085;
    }

    /* ---------- NAVEGACIÓN ---------- */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 26, 53, 0.96);
      backdrop-filter: blur(10px);
      padding: 16px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: white;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
    }

    nav ul {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    nav a {
      color: #dbe8f5;
      text-decoration: none;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #4dd7cb;
    }

    /* ---------- HERO ---------- */

    .hero {
      min-height: 90vh;
      background:
        radial-gradient(circle at 80% 20%, rgba(32,182,170,.28), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(13,53,102,.7), transparent 35%),
        linear-gradient(135deg, #06172f 0%, #082b4d 55%, #064c53 100%);
      color: white;

      display: flex;
      align-items: center;
      padding: 80px 8%;
    }

    .hero-content {
      max-width: 850px;
    }

    .eyebrow {
      color: #52ddd1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: .9;
      letter-spacing: 8px;
      margin-bottom: 25px;
    }

    .hero h2 {
      max-width: 750px;
      font-size: clamp(1.4rem, 3vw, 2.3rem);
      font-weight: 500;
      margin-bottom: 25px;
    }

    .hero p {
      max-width: 700px;
      color: #d4e2ed;
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      background: var(--teal-light);
      color: #052b33;
      text-decoration: none;
      font-weight: 800;
      padding: 15px 25px;
      border-radius: 9px;
      margin-right: 10px;
    }

    .button.secondary {
      background: transparent;
      border: 1px solid #75ddd5;
      color: white;
    }

    /* ---------- SECCIONES ---------- */

    section {
      padding: 90px 8%;
    }

    .section-title {
      max-width: 800px;
      margin-bottom: 45px;
    }

    .section-title span {
      color: var(--teal);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .section-title h2 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      margin-top: 8px;
      color: var(--navy);
    }

    .section-title p {
      margin-top: 18px;
      color: var(--gray);
      max-width: 750px;
    }

    /* ---------- PROBLEMA ---------- */

    .problem {
      background: white;
    }

    .problem-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: var(--light);
      padding: 30px;
      border-radius: 14px;
      border-top: 4px solid var(--teal);
    }

    .card h3 {
      color: var(--navy);
      margin-bottom: 12px;
    }

    /* ---------- FUNCIONAMIENTO ---------- */

    .how {
      background: #071a35;
      color: white;
    }

    .how .section-title h2 {
      color: white;
    }

    .how .section-title p {
      color: #b9cadb;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

      padding: 25px 20px;
